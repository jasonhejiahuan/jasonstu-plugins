name: PPQ question curation

on:
  pull_request:
    paths:
      - "plugins/ppq-question-curation/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/ppq-question-curation.yml"
  push:
    branches: [main]
    paths:
      - "plugins/ppq-question-curation/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/ppq-question-curation.yml"

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/ppq-question-curation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install -r skills/exam-question-curation/scripts/requirements.txt "PyYAML>=6,<7"
      - run: python -m unittest discover -s skills/exam-question-curation/scripts -p "test_*.py"
      - run: python scripts/validate_plugin.py
      - run: python scripts/package_plugin.py --out "${{ runner.temp }}/ppq-curation"
